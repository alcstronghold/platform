language: typescript
tasks:
  build:
    command: bun run build
    inputs:
    - src/**/*
    outputs:
    - dist/**/*
  typecheck:
    command: bun run typecheck
    inputs:
    - src/**/*
  test:
    command: bun test
    inputs:
    - src/**/*
  import:
    command: bun x dotenvx run -- bun run src/index.ts import
    preset: server
  export:
    command: bun x dotenvx run -- bun run src/index.ts export
    preset: server
  schema-export:
    command: bun x dotenvx run -- bun run src/index.ts schema-export
    preset: server
  schema-import:
    command: bun x dotenvx run -- bun run src/index.ts schema-import
    preset: server
  schema-clear:
    command: bun x dotenvx run -- bun run src/index.ts schema-clear
    preset: server
  env-encrypt:
    command: bun x dotenvx encrypt -ek DIRECTUS_URL -ek NODE_TLS_REJECT_UNAUTHORIZED
    inputs:
    - .env
    preset: server
  env-decrypt:
    command: bun x dotenvx decrypt
    inputs:
    - .env
    - .env.keys
    preset: server
dependsOn:
- directus-schema
- directus-payload
layer: tool
