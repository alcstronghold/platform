@for (item of options(); track item.id) {
  <label
    class="flex cursor-pointer items-center justify-between rounded-lg border p-4 transition-colors"
    [class.border-blue-600]="isSelected(item)"
    [class.bg-blue-50]="isSelected(item)"
    [class.dark:border-blue-500]="isSelected(item)"
    [class.dark:bg-blue-950]="isSelected(item)"
    [class.border-gray-200]="!isSelected(item)"
    [class.dark:border-gray-700]="!isSelected(item)"
    [class.dark:bg-gray-800]="!isSelected(item)"
  >
    <div class="min-w-0 flex-1 pe-4">
      <p class="text-sm font-medium text-gray-900 dark:text-white">{{ item.name }}</p>
      @if (item.description) {
        <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">{{ item.description }}</p>
      }
    </div>

    <!-- Toggle switch de Flowbite -->
    <div class="relative shrink-0">
      <input
        type="checkbox"
        class="peer sr-only"
        [checked]="isSelected(item)"
        (change)="toggle(item)"
      />
      <div
        class="peer h-6 w-11 rounded-full bg-gray-200 after:absolute after:start-0.5 after:top-0.5 after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-white after:transition-all after:content-[''] peer-checked:bg-blue-600 peer-checked:after:translate-x-full peer-checked:after:border-white peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 rtl:peer-checked:after:-translate-x-full dark:border-gray-600 dark:bg-gray-700 dark:peer-focus:ring-blue-800"
      ></div>
    </div>
  </label>
}
