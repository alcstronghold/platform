@if (genreGroups().length === 0) {
  <p class="text-sm text-gray-500 dark:text-gray-400">No hay géneros disponibles.</p>
} @else {
  <div class="space-y-1">
    @for (group of genreGroups(); track group.parent.id) {
      <div class="overflow-hidden rounded-lg border border-gray-200 dark:border-gray-700">

        <!-- Cabecera del acordeón -->
        <button
          type="button"
          (click)="toggleSection(group.parent.id)"
          class="flex w-full items-center justify-between bg-white px-4 py-3 text-left transition-colors hover:bg-gray-50 dark:bg-gray-800 dark:hover:bg-gray-700/50"
        >
          <div class="flex items-center gap-2">
            <span class="font-medium text-gray-900 dark:text-white">{{ group.parent.name }}</span>

            @if (group.hasSuggested) {
              <span class="text-amber-500" title="Contiene géneros sugeridos por el setting">★</span>
            }

            @if (group.selectedCount > 0) {
              <span class="rounded-full bg-blue-100 px-2 py-0.5 text-xs font-semibold text-blue-700 dark:bg-blue-900/30 dark:text-blue-300">
                {{ group.selectedCount }}
              </span>
            }
          </div>

          <!-- Chevron -->
          <svg
            class="h-4 w-4 shrink-0 text-gray-500 transition-transform duration-200 dark:text-gray-400"
            [class.rotate-180]="isOpen(group.parent.id)"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Subgéneros y el género padre como opción -->
        @if (isOpen(group.parent.id)) {
          <div class="border-t border-gray-100 p-4 dark:border-gray-700/50">
            <div class="flex flex-wrap gap-2">
              @for (item of [group.parent, ...group.children]; track item.id) {
                <label
                  class="inline-flex cursor-pointer items-center gap-1.5 rounded-full border px-3 py-1 text-sm transition-colors"
                  [class.border-blue-500]="isSelected(item.id)"
                  [class.bg-blue-50]="isSelected(item.id)"
                  [class.text-blue-700]="isSelected(item.id)"
                  [class.dark:border-blue-400]="isSelected(item.id)"
                  [class.dark:bg-blue-900/20]="isSelected(item.id)"
                  [class.dark:text-blue-300]="isSelected(item.id)"
                  [class.border-gray-200]="!isSelected(item.id)"
                  [class.text-gray-700]="!isSelected(item.id)"
                  [class.hover:bg-gray-50]="!isSelected(item.id)"
                  [class.dark:border-gray-600]="!isSelected(item.id)"
                  [class.dark:text-gray-300]="!isSelected(item.id)"
                  [class.dark:hover:bg-gray-700/50]="!isSelected(item.id)"
                >
                  <input
                    type="checkbox"
                    class="sr-only"
                    [checked]="isSelected(item.id)"
                    (change)="toggleGenre(item.id)"
                  />
                  @if (suggestedIds().has(item.id)) {
                    <span class="text-amber-500" title="Sugerido por el setting">★</span>
                  }
                  {{ item.name }}
                </label>
              }
            </div>
          </div>
        }

      </div>
    }
  </div>
}
