<div class="flex min-h-screen bg-gray-50 dark:bg-gray-900">
  <!-- Sidebar -->
  <aside class="fixed inset-y-0 left-0 z-30 flex w-64 flex-col border-r border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800">
    <!-- Header -->
    <div class="flex flex-col items-center gap-2 border-b border-gray-200 px-4 py-4 dark:border-gray-700">
      <img src="images/logo.svg" alt="ALC Stronghold" class="h-12.5 w-12.5" />
      <span class="text-lg font-semibold text-gray-900 dark:text-white">
        Dashboard
      </span>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors duration-150 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700"
      >
        <!-- Icono Dashboard (home) -->
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
        </svg>
        Dashboard
      </a>

      @if (isAdmin()) {
        <a
          routerLink="/users"
          routerLinkActive="bg-blue-50 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400"
          class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors duration-150 hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-gray-700"
        >
          <!-- Icono Usuarios -->
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
          </svg>
          Usuarios
        </a>
      }
    </nav>

    <!-- Footer del sidebar -->
    <div class="border-t border-gray-200 p-4 dark:border-gray-700">
      <!-- Toggle de tema -->
      <button
        type="button"
        data-testid="theme-toggle"
        (click)="toggleTheme()"
        class="mb-3 flex w-full items-center gap-3 rounded-lg px-3 py-2 text-sm text-gray-600 transition-colors duration-150 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-700"
      >
        @if (isDark()) {
          <!-- Icono Sol (cambiar a light) -->
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
          Modo claro
        } @else {
          <!-- Icono Luna (cambiar a dark) -->
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
          Modo oscuro
        }
      </button>

      <!-- Info del usuario -->
      @if (user()) {
        <div class="mb-3 flex items-center gap-3 px-3">
          <div class="flex h-8 w-8 items-center justify-center rounded-full bg-blue-600 text-sm font-bold text-white">
            {{ user()?.displayName?.[0]?.toUpperCase() }}
          </div>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-gray-900 dark:text-white">
              {{ user()?.displayName }}
            </p>
            <p class="truncate text-xs text-gray-500 dark:text-gray-400">
              {{ user()?.email }}
            </p>
          </div>
        </div>

        <button
          type="button"
          data-testid="logout-button"
          (click)="onLogout()"
          class="btn-danger w-full px-4 py-2 text-center"
        >
          Cerrar sesión
        </button>
      }
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="ml-64 flex-1 p-4 md:p-6">
    <router-outlet />
  </main>
</div>
