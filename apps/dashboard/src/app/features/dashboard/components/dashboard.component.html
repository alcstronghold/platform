<div class="card">
  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-4">
    Bienvenido al Dashboard
  </h1>

  @if (user()) {
    <div class="space-y-4">
      <div class="flex items-center gap-4">
        @if (user()?.avatar) {
          <img
            [ngSrc]="user()?.avatar!"
            [alt]="user()?.displayName || ''"
            width="64"
            height="64"
            class="w-16 h-16 rounded-full"
          />
        } @else {
          <div class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center text-white text-2xl font-bold">
            {{ user()?.displayName?.[0]?.toUpperCase() }}
          </div>
        }
        <div>
          <p class="text-lg font-medium text-gray-900 dark:text-white">
            {{ user()?.displayName }}
          </p>
          <p class="text-subtle">
            {{ user()?.email }}
          </p>
        </div>
      </div>

      <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
        <p class="text-subtle">
          Panel de administración de ALC Stronghold. Aquí podrás gestionar contenido, usuarios y configuraciones.
        </p>
      </div>
    </div>
  }
</div>
