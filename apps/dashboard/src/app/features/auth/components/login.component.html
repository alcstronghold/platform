<div class="min-h-screen bg-gray-50 dark:bg-gray-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="card md:p-8">
      <div class="mb-6 text-center">
        <img src="images/logo.svg" alt="ALC Stronghold" class="h-24 w-24 mx-auto mb-3" />
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">
          ALC Stronghold Dashboard
        </h1>
        <p class="text-muted">
          Inicia sesión para acceder al panel de administración
        </p>
      </div>

      @if (authError()) {
        <div class="alert-error mb-4" role="alert">
          <span class="font-medium">Error de autenticación:</span> {{ authError() }}
        </div>
      }

      <form class="space-y-6">
        <div>
          <label for="email" class="label">Email</label>
          <input
            type="email"
            id="email"
            [formField]="descriptor.form.email"
            [class]="emailError() ? 'input input-error' : 'input'"
            placeholder="tu@email.com"
          />
          @if (emailError()) {
            <p class="field-error mt-2">{{ emailError() }}</p>
          }
        </div>

        <div>
          <label for="password" class="label">Contraseña</label>
          <input
            type="password"
            id="password"
            [formField]="descriptor.form.password"
            [class]="passwordError() ? 'input input-error' : 'input'"
          />
          @if (passwordError()) {
            <p class="field-error mt-2">{{ passwordError() }}</p>
          }
        </div>

        <button
          type="button"
          (click)="login()"
          [disabled]="isSubmitting()"
          class="btn-primary w-full px-5 py-2.5 text-center disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (isSubmitting()) {
            <span>
              <svg class="inline w-4 h-4 mr-2 text-white animate-spin" viewBox="0 0 100 101" fill="none">
                <path
                  d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z"
                  fill="currentColor" />
                <path
                  d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z"
                  fill="currentFill" />
              </svg>
              Iniciando sesión...
            </span>
          } @else {
            <span>Iniciar sesión</span>
          }
        </button>
      </form>
    </div>
  </div>
</div>
