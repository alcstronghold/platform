<div>
  <h2 class="heading mb-6">Nueva sesión de rol</h2>

  @if (serverError()) {
    <div class="alert-error mb-4" role="alert">
      {{ serverError() }}
    </div>
  }

  @if (isLoadingCatalog()) {
    <div class="text-center py-8">
      <div class="inline-block h-8 w-8 animate-spin rounded-full border-4 border-solid border-blue-600 border-r-transparent"></div>
      <p class="mt-2 text-subtle">Cargando catálogos...</p>
    </div>
  } @else {
    <app-session-form
      [families]="catalog.families()"
      [editions]="catalog.editions()"
      [systems]="catalog.systems()"
      [settings]="catalog.settings()"
      [genres]="catalog.genres()"
      [ageRanges]="catalog.ageRanges()"
      [knowledgeLevels]="catalog.knowledgeLevels()"
      [accessibilityOptions]="catalog.accessibilityOptions()"
      [sessionLanguages]="catalog.sessionLanguages()"
      [contentWarnings]="catalog.contentWarnings()"
      [safetyMeasures]="catalog.safetyMeasures()"
      [isSubmitting]="isSubmitting()"
      submitLabel="Crear sesión"
      (formSubmit)="onSubmit($event)"
      (formCancel)="onCancel()"
    />
  }
</div>
