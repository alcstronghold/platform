language: typescript
type: application

dependsOn:
  - ui

tasks:
  dev:
    command: bun run dev
    local: true

  build:
    command: bun run build
    inputs:
      - src/**/*
      - public/**/*
      - astro.config.mjs
    outputs:
      - dist/**/*

  preview:
    command: bun run preview
    local: true

  test:
    command: bun run test
    inputs:
      - src/**/*.ts
      - src/**/*.spec.ts
      - vitest.config.ts
      - vitest.setup.ts
