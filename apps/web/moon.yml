language: typescript
tasks:
  dev:
    command: bun run dev
    preset: server
  build:
    command: bun run build
    inputs:
    - src/**/*
    - public/**/*
    - astro.config.mjs
    outputs:
    - dist/**/*
  preview:
    command: bun run preview
    preset: server
  test:
    command: bun run test
    inputs:
    - src/**/*.ts
    - src/**/*.spec.ts
    - vitest.config.ts
    - vitest.setup.ts
dependsOn:
- ui
layer: application
