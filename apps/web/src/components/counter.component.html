<div class="flex items-center gap-4 p-4 bg-gray-100 dark:bg-gray-800 rounded-lg">
  <button
    (click)="decrement()"
    class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors">
    -
  </button>
  <span
    class="text-2xl font-bold min-w-12 text-center"
    [class.text-green-600]="count() > 0"
    [class.text-red-600]="count() < 0"
    [class.text-gray-600]="count() === 0">
    {{ count() }}
  </span>
  <button
    (click)="increment()"
    class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white rounded-lg transition-colors">
    +
  </button>
</div>
